{% extends "base.html" %}

{% block title %}FinPulse — Register Account{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card glass-card">
        <div class="auth-header">
            <i class="fa-solid fa-user-plus auth-icon"></i>
            <h2>Create FinPulse Account</h2>
            <p class="text-muted">Join the next-generation financial telemetry platform</p>
        </div>

        <form id="registerForm" class="auth-form">
            <div class="form-group">
                <label for="username"><i class="fa-solid fa-user"></i> Username</label>
                <input type="text" id="username" name="username" class="form-input" placeholder="Choose a username" required autofocus>
            </div>

            <div class="form-group">
                <label for="email"><i class="fa-solid fa-envelope"></i> Email Address</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label for="password"><i class="fa-solid fa-key"></i> Password (min 6 chars)</label>
                <input type="password" id="password" name="password" class="form-input" minlength="6" placeholder="••••••••" required>
            </div>

            <div id="registerAlert" class="alert alert-danger" style="display: none;"></div>

            <button type="submit" class="btn btn-primary btn-block">
                <i class="fa-solid fa-user-check"></i> Register Account
            </button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="{{ url_for('web.login') }}">Log in here</a></p>
        </div>
    </div>
</div>
{% endblock %}
