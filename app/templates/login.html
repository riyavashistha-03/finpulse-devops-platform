{% extends "base.html" %}

{% block title %}FinPulse — User Login{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card glass-card">
        <div class="auth-header">
            <i class="fa-solid fa-lock-open auth-icon"></i>
            <h2>Welcome Back</h2>
            <p class="text-muted">Sign in to access your FinPulse dashboard & portfolio</p>
        </div>

        <form id="loginForm" class="auth-form">
            <div class="form-group">
                <label for="username"><i class="fa-solid fa-user"></i> Username or Email</label>
                <input type="text" id="username" name="username" class="form-input" placeholder="Enter username or email" required autofocus>
            </div>

            <div class="form-group">
                <label for="password"><i class="fa-solid fa-key"></i> Password</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
            </div>

            <div id="loginAlert" class="alert alert-danger" style="display: none;"></div>

            <button type="submit" class="btn btn-primary btn-block">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In
            </button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a href="{{ url_for('web.register') }}">Create one here</a></p>
        </div>
    </div>
</div>
{% endblock %}
