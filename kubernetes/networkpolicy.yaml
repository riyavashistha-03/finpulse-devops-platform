apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: finpulse-network-policy
  namespace: finpulse-prod
  labels:
    app: finpulse
    tier: backend
spec:
  podSelector:
    matchLabels:
      app: finpulse
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow inbound traffic from ingress controller and prometheus scraper on port 5050
    - from:
        - namespaceSelector: {}
          podSelector: {}
      ports:
        - protocol: TCP
          port: 5050
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow HTTPS/HTTP outbound for external market feeds and telemetry
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
