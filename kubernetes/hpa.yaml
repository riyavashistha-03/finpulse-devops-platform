apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: finpulse-hpa
  namespace: finpulse-prod
  labels:
    app: finpulse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: finpulse-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
