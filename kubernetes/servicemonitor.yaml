apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: finpulse-servicemonitor
  namespace: finpulse-prod
  labels:
    app: finpulse
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app: finpulse
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
