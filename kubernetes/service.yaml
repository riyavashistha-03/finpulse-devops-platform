apiVersion: v1
kind: Service
metadata:
  name: finpulse-service
  namespace: finpulse-prod
  labels:
    app: finpulse
spec:
  type: ClusterIP
  selector:
    app: finpulse
  ports:
    - name: http
      port: 80
      targetPort: 5050
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: finpulse-nodeport
  namespace: finpulse-prod
  labels:
    app: finpulse
spec:
  type: NodePort
  selector:
    app: finpulse
  ports:
    - name: http
      port: 5050
      targetPort: 5050
      nodePort: 30050
      protocol: TCP
