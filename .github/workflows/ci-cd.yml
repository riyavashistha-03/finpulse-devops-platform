name: FinPulse CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-and-coverage:
    name: Run Pytest Suite & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest with JUnit & Coverage Reports
        run: |
          mkdir -p reports
          pytest -v --junitxml=reports/pytest-results.xml --cov=app --cov-report=xml:reports/coverage.xml tests/

      - name: Upload Test Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: reports/

  security-audit:
    name: DevSecOps SAST & Secret Audit
    runs-on: ubuntu-latest
    needs: test-and-coverage

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Security Scanner
        run: |
          python scripts/security_scan.py

  docker-build-verify:
    name: Build & Verify Docker Image
    runs-on: ubuntu-latest
    needs: security-audit

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: finpulse-app:test

      - name: Test Container Health Probe
        run: |
          docker run -d --name finpulse-test -p 5050:5050 -e FLASK_ENV=production finpulse-app:test
          sleep 12
          curl -f http://localhost:5050/health
          curl -f http://localhost:5050/live
          docker stop finpulse-test
