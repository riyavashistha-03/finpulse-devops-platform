# Ansible Inventory for FinPulse Infrastructure
[control_plane]
k8s-master-01 ansible_host=192.168.1.101 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[worker_nodes]
k8s-worker-01 ansible_host=192.168.1.102 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa
k8s-worker-02 ansible_host=192.168.1.103 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[docker_hosts]
docker-srv-01 ansible_host=192.168.1.110 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[all:vars]
ansible_python_interpreter=/usr/bin/python3
app_name=finpulse
app_version=1.0.0
app_port=5050
