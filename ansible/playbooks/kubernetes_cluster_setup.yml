---
- name: Kubernetes Cluster Node Preparation & Component Setup
  hosts: control_plane:worker_nodes
  become: yes
  tasks:
    - name: Disable system swap (Kubernetes requirement)
      command: swapoff -a
      when: ansible_swaptotal_mb > 0

    - name: Permanently remove swap entries from /etc/fstab
      replace:
        path: /etc/fstab
        regexp: '^(\s*)([^#\n]+\s+swap\s+\S+\s+\S+\s+\S+)'
        replace: '# \2'

    - name: Enable kernel modules for container networking
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Configure sysctl parameters for Kubernetes networking
      sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        reload: yes
      loop:
        - { key: 'net.bridge.bridge-nf-call-iptables', value: '1' }
        - { key: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
        - { key: 'net.ipv4.ip_forward', value: '1' }

    - name: Add Kubernetes apt repository key
      apt_key:
        url: https://pkgs.k8s.io/core:/stable:/v1.29/deb/Release.key
        state: present

    - name: Add Kubernetes official repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/trusted.gpg] https://pkgs.k8s.io/core:/stable:/v1.29/deb/ /"
        state: present

    - name: Install kubelet, kubeadm, and kubectl
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: yes

    - name: Hold Kubernetes packages at current version
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl
