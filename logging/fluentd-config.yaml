apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentd-config
  namespace: finpulse-prod
  labels:
    app: fluentd
data:
  fluent.conf: |
    <source>
      @type tail
      path /var/log/containers/*finpulse*.log
      pos_file /var/log/fluentd-finpulse.log.pos
      tag kubernetes.finpulse.*
      read_from_head true
      <parse>
        @type json
        time_key time
        time_format %Y-%m-%dT%H:%M:%S.%NZ
      </parse>
    </source>

    <filter kubernetes.finpulse.**>
      @type record_transformer
      <record>
        cluster_name "finpulse-production-cluster"
        environment "production"
        service "finpulse-app"
      </record>
    </filter>

    <match kubernetes.finpulse.**>
      @type stdout
    </match>
